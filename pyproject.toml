[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hap2mqtt"
version = "0.1.0"
description = "Bridge HomeKit controllers to MQTT"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Zach White"}
]
dependencies = [
    "aiohomekit>=3.0.0",
    "asyncio-mqtt>=0.16.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
hap2mqtt = "hap2mqtt.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
